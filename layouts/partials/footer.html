{{ if site.Params.theme_config.isShowFooter }}
    <footer class="site-footer">
        <div class="w site-footer__inner">
            <p>&copy; {{ now.Format "2006" }} {{ site.Params.author | default site.Title }}</p>
            <div class="footer-links">
                <a href="{{ site.Params.github | default "https://github.com/andxre" }}">GitHub</a>
                <a href="{{ "index.xml" | relURL }}">RSS</a>
                <span>Seattle, WA</span>
            </div>
        </div>
    </footer>
{{ end }}
