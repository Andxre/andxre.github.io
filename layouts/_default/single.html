{{ define "main" }}
<article class="article">
    <div class="article__meta">
        <a href="{{ "" | relURL }}">← back</a>
        <time datetime="{{ .Date }}">{{ .Date | time.Format site.Params.theme_config.date_format }}</time>
    </div>

    <h1>{{ .Title }}</h1>

    {{ if .Params.toc }}
        <aside class="toc">
            {{ .TableOfContents }}
        </aside>
    {{ end }}

    {{ .Content }}
</article>
{{ end }}
