{{ define "main" }}
<article class="article">
    <div class="article__meta">
        <a href="{{ "" | relURL }}">← back</a>
    </div>

    <h1>{{ .Title }}</h1>

    {{ .Content }}

    {{ if .Pages }}
        {{ partial "post_list.html" (dict "context" . "section" .Section) }}
    {{ else }}
        <p class="empty">No posts yet — this space is ready.</p>
    {{ end }}
</article>
{{ end }}
