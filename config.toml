[module]
  [module.hugoVersion]
    extended = true
    min      = "0.41.0"

[markup]
  [markup.goldmark]
    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true
        title = true

  [markup.highlight]
    anchorLineNos      = false
    codeFences         = true
    guessSyntax        = false
    hl_Lines           = ''
    hl_inline          = false
    lineAnchors        = ''
    lineNoStart        = 1
    lineNos            = false
    lineNumbersInTable = true
    noClasses          = true
    noHl               = false
    style              = 'rrt'
    tabWidth           = 4

  [markup.tableOfContents]
    startLevel = 2
    endLevel   = 3
    ordered    = false

[params]
  author      = "Andre Dasalla"
  description = "Software engineer based in Seattle, WA. General interest in distributed systems & computer networks."
  github      = "https://github.com/andxre"
  favicon     = "/favicon.svg"

  [params.theme_config]
    appearance        = "auto"
    back_home_text    = "back"
    date_format       = "Jan 2, 2006"
    isListGroupByDate = false
    isShowFooter      = true
